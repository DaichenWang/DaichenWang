    <text x="700" y="450" font-size="22" font-weight="bold" fill="#003B71">The workshop instrument</text>
    <text x="656" y="494" font-size="22" fill="#1A1A1A">Message boards for asynchronous dialogue,<tspan x="656" dy="32">real-time voice, and personal courtyards</tspan><tspan x="656" dy="32">participants customise themselves.</tspan></text>
