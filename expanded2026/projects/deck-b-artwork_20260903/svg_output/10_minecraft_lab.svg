    <text x="656" y="254" font-size="22" fill="#1A1A1A">Minecraft Java Edition on a custom server,<tspan x="656" dy="32">with an in-world NPC through MinePal that</tspan><tspan x="656" dy="32">converses about garden aesthetics, classical</tspan><tspan x="656" dy="32">poetry and Chinese philosophy, switching</tspan><tspan x="656" dy="32">language on request.</tspan></text>
