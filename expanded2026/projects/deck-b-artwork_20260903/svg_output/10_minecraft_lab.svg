    <text x="72" y="476" font-size="28" fill="#1A1A1A">The project supplies a written<tspan x="72" dy="40">character brief; the service holds</tspan><tspan x="72" dy="40">it as the agent's standing</tspan><tspan x="72" dy="40">instruction.</tspan></text>
